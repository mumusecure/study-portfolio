# main 에 무엇이든 올라오면 사이트를 다시 만들어 배포한다.
# 덕분에 GitHub 웹에서 글만 써서 커밋해도 사이트가 갱신된다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:      # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 노트 날짜를 커밋 이력에서 읽으므로 전체 히스토리 필요

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/build.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 소스를 Actions 로 자동 전환 시도
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
