# 삽질/실패 기록 — 뭘 시도했고, 왜 안 됐고, 뭘 배웠는지
- date: 2026-07-23
  title: liboqs 빌드 실패 3시간
  tried: >
    PQC 알고리즘을 직접 돌려보려고 liboqs를 소스에서 빌드. cmake 옵션을
    문서 안 읽고 복붙으로 때려넣음.
  why_failed: >
    OpenSSL 경로가 시스템 기본과 homebrew 것이 섞여서 링커가 서로 다른
    버전을 집어감. 에러 메시지를 처음부터 읽었으면 10분짜리 문제였다.
  learned: >
    빌드 에러는 첫 번째 에러부터 읽는다. 마지막 에러는 대부분 첫 에러의
    연쇄 반응일 뿐이다. 그리고 cmake 옵션 복붙 전에 문서를 읽자.
