# 스킬 트리 — 공부할수록 노드가 해금된다
# status: done(해금) | learning(진행 중) | locked(잠김)
# note: 해당 개념의 위키 노트 파일명(확장자 제외) — 있으면 노드 클릭 시 이동
# topics: 그 노드에서 다루는 키워드 (트리 아래 목록으로 렌더링)
#
# 새 분야를 공부하기 시작하면 branches 아래에 브랜치를 통째로 추가하면 된다.
branches:
  - name: Cryptography
    nodes:
      - id: classic-modern
        label: 고전 암호와 현대 암호
        status: locked
        topics: [Caesar Cipher (ROT), Vigenère Cipher, Vernam Cipher, XOR, Meet-in-the-Middle Attack]

      - id: crypto-math
        label: 암호 수학
        status: locked
        requires: [classic-modern]
        topics: [Extended Euclidean Algorithm, Chinese Remainder Theorem (CRT), Euler's Theorem, Primality Test, Linear Algebra]

      - id: block-cipher
        label: 블록 암호
        status: locked
        requires: [crypto-math]
        topics: [AES, ECB, CBC, CFB, CTR, Padding Oracle Attack]

      - id: public-key
        label: 공개키 암호와 키 교환 알고리즘
        status: locked
        requires: [crypto-math]
        topics: [RSA, Diffie-Hellman Key Exchange, Common Modulus Attack, Low Exponent Attack, Hastad's Broadcast Attack, Man-in-the-Middle Attack]

      - id: hash-signature
        label: 해시와 전자 서명
        status: locked
        requires: [block-cipher]
        topics: [MD5, SHA-256, DSA, Hash Collision, Length Extension Attack, Birthday Paradox, Nonce Reuse]

      - id: elliptic-curve
        label: 타원 곡선
        status: locked
        requires: [public-key]
        topics: [Elliptic Curves]

      - id: ecc
        label: 타원 곡선 암호
        status: locked
        requires: [elliptic-curve]
        topics: [ECDH, ECDSA, Elliptic Curves]
