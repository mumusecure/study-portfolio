# 주간 기록 템플릿 — data/weeks/YYYY-Www.yml 로 복사해서 사용
# 목표: 15분 안에 작성 끝내기. 문장 다듬지 말 것. 목록으로만.
week: 2026-W32          # ISO 주차
range: 2026-08-03 ~ 2026-08-09
hours: 0                # 이번 주 공부 시간 (대략)
done:                   # 이번 주 한 일
  -
learned:                # 새로 배운 것 (1~3개면 충분)
  -
fails: []               # 삽질했으면 data/fails.yml에 쓰고 여기엔 제목만
next:                   # 다음 주 할 일
  -
